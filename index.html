['맹목적 탐색','S3','깊이 우선 탐색(DFS)의 설명으로 옳지 않은 것은?',['갈 수 있는 끝까지 가고, 막히면 되돌아와 다른 방향을 탐색한다','현재 경로만 기억하므로 메모리를 적게 쓴다','처음 찾은 경로가 항상 가장 짧다','해가 깊은 곳에 있을 때 적합하다'],2,'DFS는 가장 짧은 경로를 찾는다는 보장이 없습니다.'],

['맹목적 탐색','S2','BFS가 가장 짧은 경로를 보장하려면 필요한 조건은?',['상태의 수가 적어야 한다','한 번 이동하는 비용(간선 비용)이 모두 같아야 한다','좋은 휴리스틱이 있어야 한다','목표가 깊은 곳에 있어야 한다'],1,'구간마다 이동시간이 다르면 BFS가 먼저 찾은 경로가 가장 빠른 길이라는 보장이 사라집니다.'],
['맹목적 탐색','S2','맹목적 탐색(무정보 탐색)과 지능적 탐색의 관계로 옳은 것은?',['맹목적 탐색은 지능적 탐색의 반대말이다','맹목적 탐색은 지능적 탐색에 포함되는 두 갈래 중 하나다','지능적 탐색이 맹목적 탐색에 포함된다','맹목적 탐색은 정해진 순서가 없다'],1,'맹목적 탐색도 고르는 원칙이 정해져 있으므로 지능적 탐색의 한 갈래입니다. 목표까지 얼마나 남았는지 알려 주는 정보를 쓰지 않을 뿐입니다.'],
['맹목적 탐색','S2','다음에 확장할 노드를 “가장 나중에 발견한 것부터” 고르는 탐색은?',['BFS','DFS','A*','최상 우선 탐색'],1,'BFS는 먼저 발견한 것부터, DFS는 가장 나중에 발견한 것부터 확장합니다.'],
['휴리스틱 탐색','S3','휴리스틱 h(n)의 의미는?',['출발점에서 n까지 실제로 쓴 비용','n에서 목표까지 남았을 것으로 추정한 비용','n의 자식 노드 수','n의 깊이'],1,'h(n)은 아직 가 보지 않은 길이므로 어림짐작(추정값)입니다. 실제로 지나온 비용은 g(n)입니다.'],
['휴리스틱 탐색','S3','A* 알고리즘이 다음 노드를 고르는 기준은?',['h(n)이 가장 작은 노드','g(n)이 가장 큰 노드','f(n)=g(n)+h(n)이 가장 작은 노드','가장 나중에 발견한 노드'],2,'A*는 지금까지 온 실제 비용과 남은 예상 비용을 더한 f(n)이 가장 작은 노드를 고릅니다.'],
['휴리스틱 탐색','S3','최상 우선 탐색(f=h)의 특징으로 옳은 것은?',['지나온 비용을 함께 고려해 최단 경로를 보장한다','목표를 향해 빠르게 가지만 지나온 비용을 보지 않아 최단 경로를 보장하지 못한다','맹목적 탐색의 한 종류다','평가 함수가 없다'],1,'h(n)만 보므로 목표에는 빨리 가까워지지만, 비싼 길을 고를 수 있습니다.'],
['휴리스틱 탐색','S3','A*에서 h(n)을 실제 남은 비용보다 크게 잡으면?',['항상 더 빨리 최단 경로를 찾는다','가장 짧은 경로를 놓칠 수 있다','답은 맞지만 노드를 더 많이 확장한다','탐색이 불가능해진다'],1,'h를 넘겨 잡지만 않으면 A*는 최단 경로를 찾습니다. 크게 잡으면 가까운 길을 멀다고 판단해 제쳐 둘 수 있습니다.'],
['평가함수','S3','평가 함수 f(n)에 대한 설명으로 옳은 것은?',['후보 노드마다 매기는 점수로, 이 수업에서는 작을수록 먼저 확장한다','목표 노드에서만 계산한다','맹목적 탐색에서 가장 중요하게 쓴다','항상 클수록 좋은 값이다'],0,'평가 함수는 후보 가운데 어느 것을 다음에 확장할지 정하려고 노드마다 매기는 점수입니다. (클수록 좋은 점수형도 있으므로 방향을 먼저 확인합니다.)'],
['평가함수','S3','8-퍼즐에서 “제자리에 있는 타일 수”를 h(n)으로 쓰고 값이 가장 작은 노드를 고르면 생기는 문제는?',['아무 문제 없다','가장 나쁜(목표에서 먼) 노드를 고르게 된다','탐색이 더 빨라진다','g(n)과 단위가 같아진다'],1,'제자리에 있는 타일 수는 클수록 좋은 점수형입니다. 방향을 확인하지 않고 min을 쓰면 반대의 노드를 고릅니다. 비용형은 “제자리에 없는 타일 수”입니다.'],
['평가함수','S3','f(n)=g(n)+h(n)처럼 두 값을 더해 평가 함수를 만들 때 반드시 필요한 것은?',['두 값의 단위와 방향(작을수록 좋음)이 같아야 한다','h는 항상 g보다 작아야 한다','두 값 모두 정수여야 한다','g와 h를 곱해야 한다'],0,'단위와 방향이 다르면 더한 값이 아무 뜻도 없습니다. 점수형이면 h′=최댓값−h처럼 방향을 뒤집어 맞춥니다.'],
['평가함수','S3','1km=2분, 환승 1회=5분, 혼잡도 1단계=3분으로 환산할 때, 거리 4km·환승 2회·혼잡도 3이면 h는?',['21분','27분','29분','33분'],1,'4×2 + 2×5 + 3×3 = 8+10+9 = 27분. 서로 다른 정보를 같은 단위(분)로 바꿔 더합니다.'],
['지도·비지도','M6','지도학습과 비지도학습을 가르는 기준은?',['데이터의 양','레이블(정답)이 붙어 있는지','맞히려는 값이 숫자인지','컴퓨터 성능'],1,'레이블이 붙은 데이터로 규칙을 찾으면 지도학습, 레이블 없이 비슷함을 근거로 구조를 찾으면 비지도학습입니다.'],
['회귀·분류·군집','M6','회귀와 분류를 구분하는 기준으로 옳은 것은?',['선을 긋는지 여부','맞히려는 값이 촘촘한 숫자면 회귀, 정해진 몇 갈래 중 하나면 분류','레이블 필요 여부','데이터의 많고 적음'],1,'기온·가격 같은 연속적인 숫자는 회귀, 스팸/정상 같은 범주는 분류입니다.'],
['회귀·분류·군집','M6','자전거 대여소의 최고 기온으로 그날의 대여 건수를 예측하는 문제는?',['회귀','분류','군집','강화학습'],0,'맞히려는 값이 연속적인 숫자(대여 건수)이므로 회귀입니다. 독립 변수 하나면 단순 선형 회귀입니다.'],
['회귀·분류·군집','M6','스팸 메일을 걸러 내는 문제는?',['회귀','분류','군집','강화학습'],1,'스팸/정상 두 갈래 중 하나를 맞히는 이항 분류입니다.'],
['회귀·분류·군집','M6','매점 결제 기록만으로 비슷한 손님끼리 묶어 보는 문제는?',['지도학습의 분류','지도학습의 회귀','비지도학습의 군집','강화학습'],2,'레이블이 없고 나눌 칸이 미리 없으므로 군집입니다. 묶인 덩어리의 의미는 사람이 해석합니다.'],
['회귀·분류·군집','M6','분류와 군집의 차이로 옳은 것은?',['분류는 나눌 칸의 이름이 미리 정해져 있고, 군집은 묶은 뒤에 덩어리가 생긴다','군집은 레이블이 필요하다','분류는 레이블이 필요 없다','둘은 같은 것이다'],0,'분류는 정답이 적힌 데이터로 어느 칸에 넣을지 배우고, 군집은 칸이 없는 상태에서 비슷한 것끼리 묶습니다.'],
['기계학습 알고리즘','M6','k-최근접 이웃(k-NN)의 분류 방식은?',['가까운 k개 이웃의 다수 레이블로 분류','질문을 던져 가지를 나눔','중심점을 반복해서 옮김','양쪽에서 가장 먼 경계를 찾음'],0,'k가 너무 작으면 이웃 하나에 흔들리고, 너무 크면 동네의 특징이 뭉개집니다. 여러 k를 시험해 고릅니다.'],
['기계학습 알고리즘','M6','의사결정트리의 장점과 한계는?',['설명하기 쉽지만 가지가 너무 많으면 과적합이 생긴다','정확도가 항상 가장 높다','군집에 쓰인다','값의 범위를 반드시 정규화해야 한다'],0,'질문 분기로 판단 근거를 설명하기 쉽지만, 가지를 늘릴수록 훈련 데이터에만 맞는 과적합이 생길 수 있습니다.'],

['기계학습 알고리즘','M6','k-NN과 SVM처럼 거리를 계산하는 알고리즘에 값의 범위를 맞추는 정규화가 필요한 이유는?',['값의 폭이 넓은 속성이 거리를 거의 혼자 결정해 버리기 때문','계산이 느려지기 때문','레이블이 없기 때문','범주형이기 때문'],0,'통학 거리(0~5000m)와 공부 시간(0~6시간)을 그대로 쓰면 값의 폭이 큰 쪽이 거리를 지배합니다.'],
